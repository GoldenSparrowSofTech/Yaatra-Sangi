name: YaatraSangi CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-test-and-build:
    name: Backend API (NestJS + Prisma + Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/api/package-lock.json

      - name: Install Dependencies
        run: npm --prefix services/api ci

      - name: Generate Prisma Client
        run: cd services/api && npx prisma generate

      - name: Run Vitest Unit Tests
        run: npm --prefix services/api run test

      - name: Build NestJS Application
        run: npm --prefix services/api run build

  web-build:
    name: Web Frontend (Next.js 16)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/traveller-web/package-lock.json

      - name: Install Dependencies
        run: npm --prefix apps/traveller-web ci

      - name: Build Next.js Web App
        run: npm --prefix apps/traveller-web run build

  mobile-typecheck:
    name: Mobile App (React Native / Expo TypeScript Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/traveller-mobile/package-lock.json

      - name: Install Dependencies
        run: npm --prefix apps/traveller-mobile ci

      - name: Verify TypeScript Compilation
        run: cd apps/traveller-mobile && npx tsc --noEmit

  docker-validation:
    name: Docker Compose Syntax & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Production Docker Compose
        run: docker compose -f docker-compose.prod.yml config

